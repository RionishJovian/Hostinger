name: Mac local checks

on:
  workflow_dispatch:

jobs:
  instructions:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/ci-check.sh
