name: MikroMagic checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: owner-web/package-lock.json
      - run: bash scripts/ci-check.sh

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Refuse an unapproved deployment path
        run: |
          test -x scripts/deploy-hostinger-public-test.sh
          echo "Deployment must use the reviewed Hostinger release script."
      - name: Deploy approved SHA
        env:
          MIKROMAGIC_SSH_HOST: ${{ secrets.MIKROMAGIC_SSH_HOST }}
          PYTHON: python3
        run: bash scripts/deploy-hostinger-public-test.sh
